name: Feature request
description: Suggest a new feature or improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - vt-code
        - vt-markdown
        - vt-json
        - new component
        - core / other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Suggested attributes, events or behavior.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
