name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify committed dist/ matches the build
        run: git diff --exit-code -- dist/
      - name: Compute SRI hashes
        run: |
          {
            echo "## Files and SRI hashes"
            echo
            echo "| File | Integrity |"
            echo "|---|---|"
            for f in dist/*.js dist/*.css; do
              [ -f "$f" ] || continue
              hash=$(openssl dgst -sha384 -binary "$f" | openssl base64 -A)
              echo "| \`$f\` | \`sha384-$hash\` |"
            done
          } > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*.js dist/*.json
